<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — H-SUS</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="./images/favicon.ico" sizes="32x32"/>
  <link rel="icon" href="./images/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png"/>

  <style>
    :root {
      --primary:   #3a7bd5;
      --accent:    #00c9a7;
      --glass:     rgba(255,255,255,.14);
      --glass-hi:  rgba(255,255,255,.22);
      --line:      rgba(255,255,255,.55);
      --text:      #ffffff;
      --text-soft: rgba(255,255,255,.82);
    }
    * { box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px;
      color: var(--text);
      background: linear-gradient(160deg, #0b3a5a 0%, #0f6b80 45%, #1fa6a0 100%);
      overflow-x: hidden;
      position: relative;
    }

    /* ===== FUNDO =====
       fotos de cuidado em hospitais (Unsplash, ver images/login/CREDITOS.txt), uma por hora;
       duas camadas para a troca em fusão e uma película escura para manter o texto branco legível */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg-foto {
      position: absolute; inset: 0;
      background: center / cover no-repeat;
      opacity: 0; transform: scale(1.04);
      transition: opacity 1.8s ease, transform 12s ease-out;
    }
    .bg-foto.ativa { opacity: 1; transform: scale(1); }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(8,45,70,.58) 0%, rgba(10,90,110,.38) 100%);
    }
    @media (prefers-reduced-motion: reduce) { .bg-foto { transition: opacity .01s; transform: none; } }
    /* tela larga: a foto ocupa a esquerda e se funde no gradiente; o cartão vai para a direita e não cobre as pessoas */
    @media (min-width: 1100px) {
      body { align-items: flex-end; padding-right: max(6vw, 48px); }
      .bg-foto { right: 30%; -webkit-mask-image: linear-gradient(90deg, #000 72%, transparent 100%); mask-image: linear-gradient(90deg, #000 72%, transparent 100%); }
      .bg::after { background: linear-gradient(90deg, rgba(8,45,70,.22) 0%, rgba(8,45,70,.30) 55%, rgba(10,70,95,.55) 100%); }
      .page-footer { width: min(440px, 100%); }
    }

    /* ===== CARTÃO ===== */
    .login-card {
      --pad-x: 40px; --pad-top: 40px;
      position: relative; z-index: 1;
      width: min(440px, 100%);
      padding: var(--pad-top) var(--pad-x) 32px;
      background: var(--glass);
      border: 1.5px solid var(--line);
      border-radius: 28px;
      overflow: hidden; /* a faixa da logo acompanha os cantos arredondados */
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 24px 60px rgba(4,30,50,.35);
    }

    /* faixa branca sólida de ponta a ponta no topo do cartão */
    .brand {
      display: flex; justify-content: center;
      margin: calc(-1 * var(--pad-top)) calc(-1 * var(--pad-x)) 30px;
      padding: 22px var(--pad-x);
      background: #fff;
    }
    .brand img { height: 52px; display: block; }

    .login-card h1 { font-size: 2.3rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -.5px; }
    .login-card .subtitle { font-size: .95rem; color: var(--text-soft); margin: 0 0 30px; line-height: 1.5; }

    /* ===== CAMPOS ===== */
    .field { position: relative; margin-bottom: 16px; }
    .field input {
      width: 100%; height: 56px;
      padding: 0 54px 0 20px;
      background: rgba(255,255,255,.08);
      border: 1.5px solid var(--line); border-radius: 14px;
      color: var(--text); font-size: .98rem;
      outline: none; transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .field input::placeholder { color: rgba(255,255,255,.75); }
    .field input:focus { border-color: #fff; background: rgba(255,255,255,.16); box-shadow: 0 0 0 4px rgba(255,255,255,.15); }
    .field.error input { border-color: #ffb4b4; box-shadow: 0 0 0 4px rgba(255,107,107,.22); }

    .field-icon, .toggle-pass {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      color: var(--text); font-size: 1.6rem; font-variation-settings: 'wght' 300;
    }
    .field-icon { pointer-events: none; }
    .toggle-pass { background: none; border: none; padding: 4px; cursor: pointer; line-height: 0; border-radius: 8px; }
    .toggle-pass:hover { background: rgba(255,255,255,.12); }
    .toggle-pass:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    /* ===== LEMBRAR / ESQUECI ===== */
    .options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 26px; flex-wrap: wrap; }
    .remember { display: inline-flex; align-items: center; gap: 10px; font-size: .95rem; cursor: pointer; }
    .remember input {
      appearance: none; -webkit-appearance: none;
      width: 22px; height: 22px; margin: 0;
      border: 1.5px solid var(--line); border-radius: 6px;
      background: rgba(255,255,255,.08); cursor: pointer;
      display: grid; place-items: center; transition: background .15s;
    }
    .remember input::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); opacity: 0; }
    .remember input:checked { background: rgba(255,255,255,.35); }
    .remember input:checked::after { opacity: 1; }
    .remember input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .forgot { font-size: .88rem; color: var(--text-soft); text-decoration: none; }
    .forgot:hover { color: #fff; text-decoration: underline; }

    /* ===== BOTÃO ===== */
    .btn-login {
      width: 100%; height: 58px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 1.5px solid rgba(255,255,255,.6); border-radius: 14px;
      background: linear-gradient(100deg, rgba(0,201,167,.85) 0%, rgba(58,123,213,.95) 100%);
      color: #fff; font-size: 1.15rem; font-weight: 700; letter-spacing: .3px;
      cursor: pointer; transition: transform .2s, box-shadow .2s, filter .2s;
    }
    .btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(4,30,50,.3); filter: brightness(1.05); }
    .btn-login:disabled { cursor: default; opacity: .85; }
    .btn-login .material-symbols-outlined { font-size: 1.3rem; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-error {
      display: none; align-items: center; gap: 8px;
      margin: -8px 0 18px; padding: 10px 14px;
      background: rgba(255,107,107,.22); border: 1px solid rgba(255,180,180,.6); border-radius: 12px;
      font-size: .86rem; font-weight: 500;
    }
    .login-error.show { display: flex; }
    .login-error .material-symbols-outlined { font-size: 1.1rem; }

    .signup { text-align: center; font-size: .95rem; color: var(--text-soft); margin: 22px 0 0; }
    .signup a { color: #fff; font-weight: 700; text-decoration: none; }
    .signup a:hover { text-decoration: underline; }

    .page-footer { position: relative; z-index: 1; margin-top: 24px; font-size: .78rem; color: rgba(255,255,255,.7); text-align: center; }

    @media (max-width: 480px) {
      .login-card { --pad-x: 22px; --pad-top: 32px; padding-bottom: 26px; border-radius: 22px; }
      .login-card h1 { font-size: 1.9rem; }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"><div class="bg-foto"></div><div class="bg-foto"></div></div>

  <main class="login-card">
    <div class="brand"><img src="./images/logo.png" alt="H-SUS"></div>

    <h1>Login</h1>
    <p class="subtitle">Bem-vindo de volta! Acesse sua conta para gerenciar os atendimentos.</p>

    <form id="loginForm" novalidate>
      <div class="field" id="fieldUser">
        <label class="sr-only" for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Usuário" autocomplete="username" oninput="clearError()">
        <span class="material-symbols-outlined field-icon" aria-hidden="true">person</span>
      </div>

      <div class="field" id="fieldPass">
        <label class="sr-only" for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" oninput="clearError()">
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha" onclick="togglePassword()">
          <span class="material-symbols-outlined" id="togglePassIcon">visibility_off</span>
        </button>
      </div>

      <div class="login-error" id="loginError" role="alert">
        <span class="material-symbols-outlined">error</span>
        <span id="loginErrorMsg"></span>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="lembrar" checked> Lembrar de mim
        </label>
        <a href="#" class="forgot" onclick="esqueciSenha(event)">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    </form>

    <p class="signup">Não tem acesso? <a href="#" onclick="solicitarAcesso(event)">Solicitar acesso</a></p>
  </main>

  <p class="page-footer">Desenvolvido por Victor Aviz © 2026 - Todos os direitos reservados.</p>

<script src="./js/clinbot.js"></script>
<script>
const LEMBRAR_KEY = 'clinbot:usuarioLembrado';

// localStorage pode estar indisponível (modo privado, bloqueio do navegador)
function lerLembrado() {
  try { return localStorage.getItem(LEMBRAR_KEY) || ''; } catch (e) { return ''; }
}
function salvarLembrado(usuario) {
  try {
    if (usuario) localStorage.setItem(LEMBRAR_KEY, usuario);
    else localStorage.removeItem(LEMBRAR_KEY);
  } catch (e) { /* segue sem lembrar */ }
}

function togglePassword() {
  const input = document.getElementById('senha');
  const mostrar = input.type === 'password';
  input.type = mostrar ? 'text' : 'password';
  document.getElementById('togglePassIcon').textContent = mostrar ? 'visibility' : 'visibility_off';
  document.getElementById('togglePass').setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
}

function showError(msg, fieldIds) {
  document.getElementById('loginErrorMsg').textContent = msg;
  document.getElementById('loginError').classList.add('show');
  fieldIds.forEach(id => document.getElementById(id).classList.add('error'));
}

function clearError() {
  document.getElementById('loginError').classList.remove('show');
  document.querySelectorAll('.field.error').forEach(f => f.classList.remove('error'));
}

function esqueciSenha(e) {
  e.preventDefault();
  showError('Para redefinir a senha, procure o administrador do sistema.', []);
}

function solicitarAcesso(e) {
  e.preventDefault();
  showError('Solicite seu acesso ao administrador do sistema.', []);
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  clearError();

  const usuario = document.getElementById('usuario').value.trim();
  const senha   = document.getElementById('senha').value;

  const vazios = [!usuario && 'fieldUser', !senha && 'fieldPass'].filter(Boolean);
  if (vazios.length) {
    showError('Informe usuário e senha.', vazios);
    document.getElementById(vazios[0] === 'fieldUser' ? 'usuario' : 'senha').focus();
    return;
  }

  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined spin">progress_activity</span> Entrando...';

  // confere no cadastro de profissionais (TODO: mover a validação para o servidor quando houver backend)
  const prof = Profissionais.all().find(p => p.login.toLowerCase() === usuario.toLowerCase());
  const senhaOk = prof && (await hashSenha(senha, prof.senhaSalt)) === prof.senhaHash;
  if (!senhaOk || prof.status !== 'ativo') {
    btn.disabled = false;
    btn.textContent = 'Entrar';
    showError(senhaOk ? 'Usuário inativo. Procure o administrador do sistema.' : 'Usuário ou senha incorretos.', senhaOk ? ['fieldUser'] : ['fieldUser', 'fieldPass']);
    document.getElementById('senha').select();
    return;
  }

  salvarLembrado(document.getElementById('lembrar').checked ? usuario : '');
  iniciarSessao(prof);
  setTimeout(() => { location.href = paginaInicial(sessaoAtual()); }, 400);
});

// ===== FUNDO: uma foto diferente a cada hora =====
const FUNDOS = Array.from({ length: 12 }, (_, i) => `./images/login/fundo-${String(i + 1).padStart(2, '0')}.jpg`);
// enquadramento horizontal das fotos com gente perto da borda direita (que some no gradiente da tela larga)
const FUNDO_POSICAO = { 'fundo-04.jpg': '75% center', 'fundo-11.jpg': '70% center' };

// a sequência anda 5 fotos por dia, para a mesma hora não mostrar sempre a mesma foto
function fundoDaHora(d = new Date()) {
  const dia = Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 86400000);
  return FUNDOS[(d.getHours() + dia * 5) % FUNDOS.length];
}

let fundoAtual = '';
function mostrarFundo(src) {
  if (src === fundoAtual) return;
  fundoAtual = src;
  const img = new Image();
  img.onload = () => {
    if (fundoAtual !== src) return;
    const [ativa, proxima] = [...document.querySelectorAll('.bg-foto')].sort((a, b) => b.classList.contains('ativa') - a.classList.contains('ativa'));
    proxima.style.backgroundImage = `url("${src}")`;
    proxima.style.backgroundPosition = FUNDO_POSICAO[src.split('/').pop()] || '';
    proxima.classList.add('ativa');
    ativa.classList.remove('ativa');
  };
  img.src = src;
}

// troca na virada de cada hora; ao voltar para a aba, confere se a hora mudou enquanto ela estava escondida
function agendarFundo() {
  const agora = new Date(), proxima = new Date(agora);
  proxima.setHours(agora.getHours() + 1, 0, 0, 0);
  setTimeout(() => { mostrarFundo(fundoDaHora()); agendarFundo(); }, proxima - agora + 500);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) mostrarFundo(fundoDaHora()); });
mostrarFundo(fundoDaHora());
agendarFundo();

// ===== INIT =====
const lembrado = lerLembrado();
if (lembrado) {
  document.getElementById('usuario').value = lembrado;
  document.getElementById('senha').focus();
} else {
  document.getElementById('usuario').focus();
}
</script>
</body>
</html>
